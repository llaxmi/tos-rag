[project]
name = "tosrag-analysis"
version = "0.1.0"
description = "Phase-1 inferential statistics for tos-rag (PRD 11)"
requires-python = "==3.12.*"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "psycopg[binary]>=3.2",
]

[project.scripts]
analyze = "tosrag_analysis.cli:main"
judge-sample = "tosrag_analysis.judge_cli:sample_main"
judge-kappa = "tosrag_analysis.judge_cli:kappa_main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tosrag_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
